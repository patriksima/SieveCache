name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=$VERSION

      - name: Run tests
        run: dotnet test SieveCache.Tests/SieveCache.Tests.csproj --no-build --configuration Release

      - name: Pack
        run: dotnet pack SieveCache.Cache/SieveCache.Cache.csproj --no-build --configuration Release -p:Version=$VERSION --output artifacts

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --clobber

      # To publish to nuget.org, create an API key at https://www.nuget.org/account/apikeys,
      # store it as the NUGET_API_KEY repository secret and uncomment this step.
      # - name: Push to nuget.org
      #   run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
